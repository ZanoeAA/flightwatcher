name: Flight Price Check (every 10 days)

on:
  schedule:
    # Runs at 07:00 UTC every 10th day. GitHub Actions cron doesn't support
    # "every N days" natively, so this uses a day-of-month pattern that
    # lands roughly every 10 days. You can also just trigger it manually
    # via "Run workflow" below whenever you want to check.
    - cron: "0 7 1,11,21 * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab too

jobs:
  check-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run price check
        env:
          FLIGHTAPI_KEY: ${{ secrets.FLIGHTAPI_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python flight_watcher.py

      - name: Commit updated log
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add price_log.csv || true
          git diff --staged --quiet || git commit -m "Update price log $(date -u +%Y-%m-%d)"
          git push
